<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo querySelector()</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        .destacado{
            color:green;
            font-size:22px;
        }

        button{
            padding:10px 20px;
        }

    </style>
</head>

<body>

<h1>document.querySelector()</h1>

<p class="destacado">
    Primer párrafo destacado.
</p>

<p class="destacado">
    Segundo párrafo destacado.
</p>

<button onclick="cambiarColor()">
    Cambiar color
</button>

<script>

function cambiarColor(){

    let parrafo = document.querySelector(".destacado");

    parrafo.style.color = "red";

    parrafo.textContent = "Soy el primer elemento encontrado con querySelector().";

}

</script>

</body>
</html>
